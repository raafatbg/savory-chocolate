<!doctype html>
<html lang="en">
<head>
  <title>Gallery · {{shop_name}}</title>
  <meta name="description" content="Cakes and treats from the {{shop_name}} kitchen.">
  {{> head}}
</head>
<body>
  {{> header}}

  <main id="main">
    <section class="page-hero">
      <div class="container" data-reveal>
        <span class="eyebrow">Gallery</span>
        <h1>From our <em class="gold-text">kitchen</em></h1>
        <p>A few of the cakes and treats we've had the pleasure of making.</p>
      </div>
    </section>

    <div class="container" style="padding-bottom: 96px;">
      <div class="masonry" id="gallery"><p class="loading">Loading…</p></div>
      <div class="card empty-state" id="gallery-empty" hidden style="padding: 64px 24px;">
        <span class="script" style="font-size: 2.2rem;">Coming soon</span>
        <h2 style="margin-top: 8px;">Our gallery is being plated</h2>
        <p>We're photographing our latest creations. In the meantime, why not design your own?</p>
        <a class="btn btn-gold" href="/cakes" style="margin-top: 12px;">Design a cake</a>
      </div>
    </div>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Photo">
    <button type="button" class="dialog-close" data-close aria-label="Close">✕</button>
    <button type="button" class="nav prev" data-step="-1" aria-label="Previous photo">‹</button>
    <figure><img id="lb-img" alt=""><figcaption id="lb-caption"></figcaption></figure>
    <button type="button" class="nav next" data-step="1" aria-label="Next photo">›</button>
  </dialog>

  {{> footer}}
  <script type="module" src="/js/screens/gallery.js"></script>
</body>
</html>
