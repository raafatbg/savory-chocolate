<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="{{shop_name}} menu home">
      {{> brand-logo}}
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="/" data-page="menu" data-i18n="nav_menu">Menu</a>
      <a href="/#box-banner" data-i18n="nav_boxes">Gift Boxes</a>
      <a href="/#what-we-make" data-i18n="nav_specialties">Specialties</a>
      <a href="/track" data-page="track" data-i18n="nav_track">Track Order</a>
      <a href="/#visit-section" data-i18n="foot_visit">Visit Us</a>
    </nav>
    <div class="header-actions">
      <a class="sister-site-pill" href="{{cakes_site_url}}" target="_blank" rel="noopener" title="Design a Custom 3D Cake at SAVORY Cake Studio">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M2 21h20"/><path d="M7 8v3M12 8v3M17 8v3"/></svg>
        <span>3D Cake Studio ↗</span>
      </a>
      <a class="active-order-pill" id="header-order-pill" href="/track?site=menu" hidden title="Track your recent SAVORY order"></a>
      <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language / تغيير اللغة" title="Switch language / تغيير اللغة">عربي</button>
      <a class="btn btn-gold btn-sm header-cta" href="/#cart" data-i18n="cta_order">Your order</a>
    </div>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
