<div class="field" data-branch-field hidden>
  <span class="label">Which branch?</span>
  <div class="choices branch-choices" data-branch-choices role="radiogroup" aria-label="Branch"></div>
</div>
<div class="segmented" data-fulfillment role="radiogroup" aria-label="Pickup or delivery">
  <label><input type="radio" name="fulfillment" value="pickup" checked> Pickup</label>
  <label><input type="radio" name="fulfillment" value="delivery"> Delivery</label>
</div>
<div data-delivery-fields hidden>
  <div class="field">
    <label for="delivery_address">Delivery address</label>
    <textarea id="delivery_address" name="delivery_address" rows="2" maxlength="300" autocomplete="street-address" placeholder="Street, number, apartment, city"></textarea>
    <span class="hint" data-delivery-area></span>
  </div>
</div>
<div class="field-row">
  <div class="field">
    <label for="pickup_date" data-when-label="date">Pickup date</label>
    <input type="date" id="pickup_date" name="pickup_date" required>
    <span class="hint" id="date-hint"></span>
  </div>
  <div class="field">
    <label for="pickup_time" data-when-label="time">Pickup time</label>
    <input type="time" id="pickup_time" name="pickup_time" step="900" required>
    <span class="hint">During opening hours.</span>
  </div>
</div>
