<section class="section" id="omvi-band" style="padding-top: 0;">
  <div class="container">
    <div class="omvi-band" data-reveal>
      <span class="omvi-band-bg" aria-hidden="true">{{omvi_name}}</span>
      <div class="omvi-band-copy">
        <span class="eyebrow left">Designed &amp; built by</span>
        <div class="omvi-wordmark">{{omvi_name}}</div>
        <p>{{omvi_tagline}} This website, its live 3D cake builder and WhatsApp ordering were created by {{omvi_name}}.</p>
        <div class="chips">{{{omvi_services}}}</div>
      </div>
      <div class="omvi-band-cta">
        <a class="btn btn-gold btn-lg" href="/contact#omvi">Work with {{omvi_name}} <span class="arrow" aria-hidden="true">→</span></a>
      </div>
    </div>
  </div>
</section>
