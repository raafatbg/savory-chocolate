<a class="skip-link" href="#main">Skip to content</a>
<div class="at-notice"><span data-lead-days="{{cake_lead_days}}">{{lead_notice}}</span> · <span data-i18n="notice_pay">Pay on pickup or delivery</span></div>
<header class="at-header" id="site-header">
  <div class="at-wrap at-header-inner">
    <a class="at-brand" href="/" aria-label="{{shop_name}} home">
      {{> brand-logo}}
    </a>

    <div class="at-scrim" id="nav-scrim" aria-hidden="true"></div>

    <nav class="at-nav" id="site-nav" aria-label="Main">
      <div class="at-nav-head">
        <span class="at-nav-title">{{shop_name}}</span>
        <button type="button" class="at-icon-btn" id="drawer-close" aria-label="Close menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <a href="/cakes" data-page="cakes" data-i18n="nav_cakes_short">Cakes</a>
      <a href="{{menu_site_url}}" data-i18n="nav_menu_cafe">Chocolates &amp; Café</a>
      <a href="/gallery" data-page="gallery" data-i18n="nav_gallery">Gallery</a>
      <a href="/contact" data-page="contact" data-i18n="nav_visit">Visit</a>
      <div class="at-nav-extra">
        <a href="/about" data-page="about" data-i18n="nav_about">Our story</a>
        <a href="/track" data-page="track" data-i18n="nav_track">Track an order</a>
        <a href="/faq" data-page="faq" data-i18n="nav_faq">FAQ</a>
        {{#whatsapp}}<a href="{{whatsapp_href}}" target="_blank" rel="noopener">WhatsApp {{whatsapp}}</a>{{/whatsapp}}
      </div>
    </nav>

    <div class="at-actions">
      <a class="at-order-pill" id="header-order-pill" href="/track" hidden title="Track your recent order"></a>
      <button type="button" class="at-lang" id="lang-toggle" aria-label="Switch language / تغيير اللغة">عربي</button>
      <a class="at-btn at-btn-sm at-header-cta" href="/cakes" data-i18n="cta_order_cake">Order a cake</a>
      <button type="button" class="at-icon-btn at-menu-btn" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
      </button>
    </div>
  </div>
</header>
