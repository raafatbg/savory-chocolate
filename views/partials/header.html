<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="{{shop_name}} cake studio home">
      {{> brand-logo}}
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="/" data-page="home" data-i18n="nav_home">Cake Studio</a>
      <a href="/cakes" data-page="cakes" data-i18n="nav_cakes">3D Cake Builder</a>
      <a href="/gallery" data-page="gallery" data-i18n="nav_gallery">Gallery</a>
      <a href="/track" data-page="track" data-i18n="nav_track">Track Order</a>
      <a href="/about" data-page="about" data-i18n="nav_about">About</a>
      <a href="/faq" data-page="faq" data-i18n="nav_faq">FAQ</a>
      <a href="/contact" data-page="contact" data-i18n="nav_contact">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="sister-site-pill" href="{{menu_site_url}}" target="_blank" rel="noopener" title="Explore SAVORY Chocolatier &amp; Cafe Menu">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>
        <span>Chocolates &amp; Menu ↗</span>
      </a>
      <a class="active-order-pill" id="header-order-pill" href="/track" hidden title="Track your recent SAVORY order"></a>
      <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language / تغيير اللغة" title="Switch language / تغيير اللغة">عربي</button>
      <a class="btn btn-gold btn-sm header-cta" href="/cakes" data-i18n="cta_design">Design a cake</a>
    </div>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
