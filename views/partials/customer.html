<div class="field">
  <label for="customer_name">Full name</label>
  <input type="text" id="customer_name" name="customer_name" autocomplete="name" maxlength="100" required>
</div>
<div class="field-row">
  <div class="field">
    <label for="customer_phone">Phone</label>
    <input type="tel" id="customer_phone" name="customer_phone" autocomplete="tel" maxlength="40" required>
  </div>
  <div class="field">
    <label for="customer_email">Email <span class="optional">(optional)</span></label>
    <input type="email" id="customer_email" name="customer_email" autocomplete="email" maxlength="200">
  </div>
</div>
