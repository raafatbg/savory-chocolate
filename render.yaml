# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web service for client testing. The free plan has no persistent disk, so the
# database and uploaded photos reset when the service restarts or redeploys.
services:
  - type: web
    name: savory-chocolate
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/settings
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "24"
